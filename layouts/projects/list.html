{{ define "main" }}
<main>
    <h1 class="page-title">Projects</h1>
    
    <div class="projects-description" style="margin-bottom: 30px; line-height: 1.6; opacity: 0.8;">
        <p>
			A collection of my technical work and code.
        </p>
    </div>

    <ul class="posts">
        {{- range .Pages -}}
        <li class="post">
            {{ if .Params.link }}
                <a href="{{ .Params.link }}" target="_blank" rel="noopener noreferrer">{{ .Title }}</a>
            {{ else }}
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ end }}
            <span class="meta">{{ .Date.Format "Jan 2, 2006" }}</span>
        </li>
        {{- end -}}
    </ul>
</main>
{{ end }}
