<header class="site-header">
  {{- if not .IsHome }}
  <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  {{- end }}
  <nav aria-label="Main">
    {{- $current := . }}
    {{- range site.Menus.main }}
    <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
    {{- $sub := site.GetPage "/subscribe" }}
    <a href="{{ $sub.RelPermalink }}"{{ if eq $current $sub }} aria-current="page"{{ end }}>RSS</a>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle light / dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
    </button>
  </nav>
</header>
