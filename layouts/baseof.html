<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="wrap">
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  <script>
    (function () {
      var root = document.documentElement, btn = document.querySelector(".theme-toggle");
      function label() { btn.setAttribute("aria-label", root.dataset.theme === "light" ? "Switch to dark mode" : "Switch to light mode"); }
      label();
      btn.addEventListener("click", function () {
        var next = root.dataset.theme === "light" ? "dark" : "light";
        if (next === "light") root.dataset.theme = "light"; else delete root.dataset.theme;
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
    })();
  </script>
</body>
</html>
