baseURL = "https://agastyapatri.com/"
locale = "en-US"
title = "Agastya Patri"
copyright = "Agastya Patri"
enableRobotsTXT = true

[params]
  description = "Machine Learning + Physics, Systems and more."
  subtitle = "Machine learning · Physics · Systems"
  mainSections = ["writing"]
  recentPosts = 6

[[params.social]]
  name = "GitHub"
  url = "https://github.com/agastyapatri"

[[params.social]]
  name = "Substack"
  url = "https://substack.com/@agastyapatri"

[menus]
  [[menus.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 1
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 2
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 3

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML", "RSS"]

[services.rss]
  limit = 20
